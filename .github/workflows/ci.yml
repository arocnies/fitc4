# CI for the fitc4 monorepo.
#
# verify: runs `check` in every workspace — typecheck, build, and unit tests
#         for packages/fitc4, plus format/model validation, typecheck, tests,
#         and the fitc4 gate itself for example/.
# smoke:  packs the fitc4 tarball, installs it into a throwaway consumer, and
#         asserts the CLI, library entry point, schema export, and pass/fail
#         gate behave the way a real npm consumer would see them.
# likec4 latest (advisory): reruns the fitc4 build and tests with likec4@latest
#         in place of the lockfile resolution, so skew against new likec4
#         releases shows up here instead of in a consumer's install. It never
#         blocks a merge; a red leg means "look at the new likec4 release".
#
# eval:  the eval harness in stub mode — deterministic, free, and the gate
#         over the fixtures, expectations, and pipeline wiring (harness
#         regressions surface here, agent quality never does; live mode stays
#         a human's command). External fixture checkouts are cached by their
#         pins; a cache miss fetches the four pinned sparse checkouts once.
#
# `npm ci` runs the package's `prepare` script, which builds dist/ — no
# separate build step is needed. Node 22 is the matrix floor because the
# likec4 dependency requires node >=22.22.3.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    # Linux only, deliberately: Windows has no users yet and an unverified red
    # leg is drag, not signal. Paths are POSIX-normalized throughout and the
    # known Windows hazards (smoke.sh path conversion, fixture symlinks) are
    # already handled — add a windows-latest leg when a Windows consumer exists.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run verify

      - run: npm run smoke

      # The external fixtures' sparse checkouts, keyed on their pins: the
      # key changes exactly when an external.json changes, and a cached
      # checkout is verified against its pin on every use, so a stale
      # restore fails loudly rather than scoring silently.
      - uses: actions/cache@v4
        with:
          path: evals/.cache/repos
          key: eval-checkouts-${{ hashFiles('evals/fixtures/*/external.json') }}

      # Naming the external fixtures is the harness's permission to fetch on
      # a cache miss; the second run covers everything, externals included,
      # and is what gates.
      - run: npm run eval -- --fixture ddh --fixture boutique --fixture ecom --fixture supabase
      - run: npm run eval

  likec4-latest:
    name: likec4 latest (advisory)
    runs-on: ubuntu-latest
    # Advisory by design: fitc4 declares likec4 as a caret range, so this leg
    # warns about drift against the newest release without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: install likec4@latest into the workspace
        run: npm install likec4@latest -w packages/fitc4 --no-save

      - name: print the likec4 version under test
        run: node -p "require('likec4/package.json').version"
        working-directory: packages/fitc4

      - name: build and test fitc4 against it
        run: npm run check -w packages/fitc4
